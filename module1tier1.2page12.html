<!DOCTYPE html>
<html>
<head>
  
  <title>   </title>

  <!-- ✅ Important for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* ✅ IMAGE */
.intro-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ✅ FLOATING BUTTON */
.complete-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;

  padding: 12px 20px;
  background-color: #225e5f;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;

  z-index: 999;
}

.complete-btn:hover {
  background-color: #1a4d4d;
}

/* ✅ MOBILE FIX */
@media (max-width: 768px) {
  .complete-btn {
    left: 10px;
    right: 10px;
    width: auto;
    text-align: center;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div class="intro-container">

 
  <img src="assets/images/12_Reflection-and-Activity.png" alt="Reflection and Activity">


  

  <button class="complete-btn" onclick="completeAndGoQuiz()">
  Complete Module & Take Quiz
</button>

<script>
function completeAndGoQuiz() {
  // save next module after quiz
  localStorage.setItem("nextModule", "module1tier1.2.html");

  // OPTIONAL: update progress
  let progress = parseInt(localStorage.getItem("progress")) || 1;
  localStorage.setItem("progress", progress + 1);

  // go to quiz
  window.location.href = "module1tier1.2quiz.html";
}
</script>

</body>
</html>
