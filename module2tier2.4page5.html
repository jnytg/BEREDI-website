<!DOCTYPE html>
<html>
<head>
  <title>Evaluation and Debriefing</title>

  <!-- ✅ Important for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .intro-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black; 
}

    .intro-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .next-btn {
      position: absolute;
      bottom: 40px;
      right: 40px;
      padding: 15px 30px;
      font-size: 18px;
      background: #00796b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .next-btn:hover {
      background: #004d40;
    }

    /* ✅ Mobile adjustments */
    @media (max-width: 768px) {
      .next-btn {
        bottom: 20px;
        right: 20px;
        padding: 10px 20px;
        font-size: 14px;
      }
    }

  </style>
</head>

<body>

<div class="intro-container">

  <!-- ✅ Replace with your real image -->
  <img src="assets/images/5_43-Evaluation-and-Debriefing.png" alt="Evaluation and Debriefing">

  <button class="next-btn" onclick="goNext()">Complete Module →</button>

<script>
function goNext(){

  // GET SAVED MODULE DATA
  let moduleData = JSON.parse(localStorage.getItem("moduleData")) || {};

  // 🔥 GET CURRENT MODULE (VERY IMPORTANT)
  const currentModule = localStorage.getItem("currentModule");

  if (!currentModule) {
    alert("Module not set properly.");
    return;
  }

  // ✅ MARK CURRENT MODULE AS COMPLETED
  moduleData[currentModule] = "completed";

  localStorage.setItem("moduleData", JSON.stringify(moduleData));

  // 🔥 OPTIONAL: AUTO SET NEXT MODULE
  const moduleOrder = ["module1","module2","module3","module4","module5","module6"];
  const index = moduleOrder.indexOf(currentModule);

  if (index !== -1 && index < moduleOrder.length - 1) {
    const nextModule = moduleOrder[index + 1];
    localStorage.setItem("currentModule", nextModule);
  }

  // ✅ GO BACK TO MODULES PAGE
  window.location.href = "modules.html";
}
</script>

</body>
</html>
