<button onclick="openModal()">Open Window</button>

<div id="myModal" style="display:none; position:fixed; top:0; left:0; 
  width:100%; height:100%; background:rgba(0,0,0,0.5);">
  <div style="background:white; margin:10% auto; padding:20px; width:300px;">
    <h2>Next Window</h2>
    <p>This is the floating content.</p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
function openModal() {
  document.getElementById("myModal").style.display = "block";
}
function closeModal() {
  document.getElementById("myModal").style.display = "none";
}
</script>
