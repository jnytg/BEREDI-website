<!DOCTYPE html>
<html>
<head>
  <title>Reflection And Challenge</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
    }

    .intro-container{
      position:relative;
      width:100%;
      height:100vh;
    }

  .intro-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

    .next-btn{
      position:absolute;
      bottom:40px;
      right:40px;
      padding:15px 30px;
      font-size:18px;
      background:#00796b;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .complete-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00c6ff;
  color: black;
  border: none;
  padding: 14px 18px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1000;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* 📱 MOBILE / TABLET */
@media (max-width: 600px) {
  .complete-btn {
    right: 50%;
    transform: translateX(50%);
    width: 85%;
    text-align: center;
  }
}

    .next-btn:hover{
      background:#004d40;
    }

  </style>
</head>

<body>

<div class="intro-container">

  <img src="assets/images/6_Reflection-And-Challenge.png" alt="Reflection And Challenge">

  <button class="complete-btn" onclick="completeAndGoQuiz()">
  Complete Module & Take Quiz
</button>

<script>
function completeAndGoQuiz() {
  // save next module after quiz
  localStorage.setItem("nextModule", "module2tier1.3page1.html");

  // OPTIONAL: update progress
  let progress = parseInt(localStorage.getItem("progress")) || 1;
  localStorage.setItem("progress", progress + 1);

  // go to quiz
  window.location.href = "module2tier1.2quiz.html";
}
</script>

</body>
</html>
