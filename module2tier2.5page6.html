<!DOCTYPE html>
<html>
<head>
  <title>Module Wrap-Up</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
    }

    .intro-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .intro-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    .complete-btn {
      position: absolute;
      bottom: 40px;
      right: 40px;
      padding: 15px 30px;
      font-size: 18px;
      background: #00796b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .complete-btn {
        bottom: 20px;
        right: 20px;
        font-size: 14px;
        padding: 12px 20px;
      }
    }
  </style>
</head>

<body>

<div class="intro-container">
  <img src="assets/images/6_Module-Wrap-Up.png" alt="Module Wrap-Up">

  <button class="complete-btn" onclick="goToQuiz()">
    Complete Module & Take Quiz
  </button>
</div>

<script>

function goToQuiz() {

  // 🔥 SET CURRENT QUIZ CONTEXT (IMPORTANT FOR CERT)
  localStorage.setItem("currentQuiz", "module2lastquiz");

  // 🔥 REDIRECT TO QUIZ
  window.location.href = "module2lastquiz.html";
}

</script>

</body>
</html>
