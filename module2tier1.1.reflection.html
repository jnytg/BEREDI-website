<!DOCTYPE html>
<html>
<head>
  <title> Reflection </title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
    }

    .intro-container{
      position:relative;
      width:100%;
      height:100vh;
    }

  .intro-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

    .next-btn{
      position:absolute;
      bottom:40px;
      right:40px;
      padding:15px 30px;
      font-size:18px;
      background:#00796b;
      color:white;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }

    .next-btn:hover{
      background:#004d40;
    }

  .complete-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;

  padding: 15px 25px;
  font-size: 16px;
  background: #2c7a7b;
  color: white;
  border: none;
  border-radius: 10px;

  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.complete-btn:hover {
  background: #225e5f;
}

  </style>
</head>

<body>

<div class="intro-container">

  <img src="assets/images/6_Reflection.png" alt="Module Summary" alt="Reflection">

 <button class="next-btn" onclick="goNext()">Complete Module →</button>

<script>
function goNext(){

  // Get existing progress or create new
  let moduleData = JSON.parse(localStorage.getItem("moduleData")) || {};

moduleData["module3"] = "completed";

localStorage.setItem("moduleData", JSON.stringify(moduleData));

window.location.href = "modules.html";
}
</script>
</body>
</html>
