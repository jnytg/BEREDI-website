<!DOCTYPE html>
<html>
<head>
  <title> Module Summary </title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
    }

    .intro-container{
      position:relative;
      width:100%;
      height:100vh;
    }

    .intro-container img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .next-btn{
      position:absolute;
      bottom:40px;
      right:40px;
      padding:15px 30px;
      font-size:18px;
      background:#00796b;
      color:white;
      border:none;
      border-radius:6px; 
      cursor:pointer;
    }

    .next-btn:hover{
      background:#004d40;
    }

    .complete-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;

  padding: 15px 25px;
  font-size: 16px;
  background: #2c7a7b;
  color: white;
  border: none;
  border-radius: 10px;

  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.complete-btn:hover {
  background: #225e5f;
}

  </style>
</head>

<body>

<div class="intro-container">



  <img src="assets/images/9_Module-Summary.png" alt="Module Summary">

  <button class="complete-btn" onclick="completeAndGoQuiz()">
  Complete Module & Take Quiz
</button>

<script>
function completeAndGoQuiz() {
  // save next module after quiz
  localStorage.setItem("nextModule", "module1tier1.2.html");

  // OPTIONAL: update progress
  let progress = parseInt(localStorage.getItem("progress")) || 1;
  localStorage.setItem("progress", progress + 1);

  // go to quiz
  window.location.href = "module1tier1.1quiz.html";
}
</script>

</body>
</html>
